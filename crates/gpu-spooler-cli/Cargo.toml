[package]
name = "gpu-spooler-cli"
description = "The `task` command: queue jobs onto SSH-reachable GPU servers"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "task"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
rusqlite = "0.32"
gpu-spooler = { path = "../gpu-spooler" }

[dev-dependencies]
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
