[package]
name = "gpu-spooler"
description = "Queue jobs onto SSH-reachable GPU servers (library: config, ssh transport, GPU queries, queue)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "gpu_spooler"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
getrandom = "0.3"
indexmap = "2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
specta = { version = "2.0.0-rc.26", features = ["derive"], optional = true }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = { version = "0.8", features = ["preserve_order"] }
wait-timeout = "0.2"

[features]
# TypeScript types for the desktop app (desktop/), through tauri-specta.
specta = ["dep:specta"]

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
