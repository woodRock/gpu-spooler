[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-spooler"
version = "0.1.0"
description = "GPU task spooler that queues jobs onto SSH-reachable GPU servers"
requires-python = ">=3.10"
dependencies = ["tomli; python_version < \"3.11\""]

[project.optional-dependencies]
tui = ["textual>=1.0"]
test = ["pytest", "textual>=1.0"]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
task = "gpu_spooler.task:main"
gpu-status = "gpu_spooler.gpu_status:main"
tui = "gpu_spooler.tui:main"
