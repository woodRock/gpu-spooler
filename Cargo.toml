[workspace]
resolver = "2"
members = ["crates/gpu-spooler", "crates/gpu-spooler-cli"]
# The desktop app has its own lockfile, so the CLI and its CI never build Tauri.
exclude = ["desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
repository = "https://github.com/woodRock/gpu-spooler"
license = "MIT"

[profile.release]
lto = true
strip = true
